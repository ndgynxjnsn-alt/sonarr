# Sonarr: SonarQube Developer + PostgreSQL 18 behind Traefik (TLS / ACME),
# with periodic pg_dump backups and a Grafana Alloy sidecar shipping logs and
# metrics to an external LGTM stack (Loki + Mimir).
#
#   Internet --443--> traefik --> sonarqube --> postgres <-- pgbackup (pg_dump)
#   alloy: sonarqube logs/metrics + host (node) metrics  -->  Loki / Mimir
#
# Copy .env.example to .env and fill in the secrets before `docker compose up -d`.

name: sonarr

services:
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sonarr_web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Company ACME CA (External Account Binding). Traefik's built-in ACME
      # client issues and renews automatically; no certbot needed.
      - --certificatesresolvers.company.acme.caserver=${ACME_CA_SERVER:?set ACME_CA_SERVER in .env}
      - --certificatesresolvers.company.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.company.acme.eab.kid=${ACME_EAB_KID:?set ACME_EAB_KID in .env}
      - --certificatesresolvers.company.acme.eab.hmacencoded=${ACME_EAB_HMAC:?set ACME_EAB_HMAC in .env}
      - --certificatesresolvers.company.acme.keytype=${ACME_KEY_TYPE:-EC256}
      - --certificatesresolvers.company.acme.storage=/acme/acme.json
      - --certificatesresolvers.company.acme.httpchallenge.entrypoint=web
      - --global.aliasheadersstrategy=delete
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # PEM bundle of the company root CA, if the ACME server's TLS cert is not
      # publicly trusted (e.g. /certs/company-root-ca.pem). Empty = system trust.
      LEGO_CA_CERTIFICATES: ${ACME_CA_CERTIFICATES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
      - ./certs:/certs:ro
    networks: [web]

  sonarqube:
    # Override SONARQUBE_VERSION only while hopping through LTAs (see upgrade.md).
    image: sonarqube:${SONARQUBE_VERSION:-2026.5.5}-developer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Passcode for /api/monitoring/metrics (Prometheus), used by alloy.
      SONAR_WEB_SYSTEMPASSCODE: ${SONAR_MONITORING_PASSCODE:?set SONAR_MONITORING_PASSCODE in .env}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
      nproc: 8192
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarqube.rule=Host(`${SONAR_HOST:-sonarqube.org}`)
      - traefik.http.routers.sonarqube.entrypoints=websecure
      - traefik.http.routers.sonarqube.tls=true
      # Empty TLS_CERTRESOLVER = no ACME, Traefik serves its self-signed default cert.
      - traefik.http.routers.sonarqube.tls.certresolver=${TLS_CERTRESOLVER-company}
      - traefik.http.services.sonarqube.loadbalancer.server.port=9000
    networks: [web, db]

  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
      POSTGRES_USER: ${POSTGRES_USER:-sonarqube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # PG 18 images keep data in /var/lib/postgresql/18/docker; mount the parent.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [db]

  pgbackup:
    image: prodrigestivill/postgres-backup-local:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-sonarqube}
      POSTGRES_USER: ${POSTGRES_USER:-sonarqube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [db]

  # Observability sidecar: SonarQube log files + /api/monitoring/metrics and
  # host node metrics, pushed to Loki and Mimir.
  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    pid: host
    environment:
      LOKI_URL: ${LOKI_URL:-http://host.docker.internal:3100/loki/api/v1/push}
      MIMIR_URL: ${MIMIR_URL:-http://host.docker.internal:9009/api/v1/push}
      SONAR_MONITORING_PASSCODE: ${SONAR_MONITORING_PASSCODE}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - sonarqube_logs:/sonarqube/logs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /run/udev/data:/run/udev/data:ro
      - alloy_data:/var/lib/alloy/data
    networks: [web]

networks:
  web:
  db:

volumes:
  acme:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:
  alloy_data:
